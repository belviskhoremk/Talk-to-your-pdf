<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Talk to your PDF</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    #chat-container {
      width: 80%;
      max-width: 600px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      overflow-y: auto;
      max-height: 400px;
      margin-bottom: 20px;
    }
    #chat-container p {
      margin: 5px 0;
    }
    .chat-input-container {
      width: 80%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      bottom: 10px;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
    }
    input[type="text"] {
      width: calc(100% - 70px);
      padding: 8px;
      border: none;
      border-radius: 4px;
      margin-right: 10px;
    }
    button {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
  <script>
    // Append one chat line. textContent (not innerHTML) prevents the question
    // or the model's answer from injecting HTML/JS into the page.
    function addMessage(author, text) {
      const line = document.createElement('p');
      const who = document.createElement('strong');
      who.textContent = author + ': ';
      line.append(who, text);
      const chat = document.getElementById('chat-container');
      chat.appendChild(line);
      chat.scrollTop = chat.scrollHeight; // auto-scroll to the newest message
    }

    async function askQuestion() {
      const input = document.getElementById('question');
      const question = input.value.trim();
      if (!question) return;

      addMessage('You', question);
      input.value = '';

      try {
        const response = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await response.json();
        addMessage('Bot', data.answer ?? `Error: ${data.error}`);
      } catch (err) {
        addMessage('Bot', 'Error: could not reach the server.');
      }
    }

    // Send the question when Enter is pressed.
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('question').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') askQuestion();
      });
    });
  </script>
</head>
<body>
  <h1>Talk to your PDF</h1>
  <div id="chat-container"></div>
  <div class="chat-input-container">
    <input type="text" id="question" placeholder="Type your question here" />
    <button type="button" onclick="askQuestion()">Ask</button>
  </div>
</body>
</html>
